{
  "openapi": "3.0.3",
  "info": {
    "title": "轻养健康 M05 积分、权益、活动预约、社区与运营后台",
    "version": "QY-MYSQL-1.1.0",
    "description": "以正式 M01 邮箱会话装配后的实现为准，覆盖当前实际注册的全部 M05 HTTP 操作。API 统一 /api/v1，数据 UTC 毫秒时间，业务日 Asia/Shanghai，积分均整数。公共列表允许匿名，其余须 qy_access；所有写操作须正确 Origin、CSRF、UUIDv4 Idempotency-Key。后台另需 admin 角色，事务内再次校验。未知请求字段/筛选拒绝；未列入 M05 的 M01 登录、刷新、退出、上传、站内通知继续使用 M01.yaml。没有开发身份、短信、私信或动态流接口。规则启用由运营明确决定；供应商实测和生产配置另行验收。文档 JSON 编码为合法 YAML 1.2，与现有 M03.yaml 格式一致。"
  },
