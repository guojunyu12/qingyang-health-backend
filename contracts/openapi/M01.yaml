    },
    "/auth/login": {
      "post": {
        "summary": "邮箱验证后登录或注册",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "description": "同一次认证重试复用；30秒内以专用加密结果恢复，不经过普通幂等缓存。不同内容同key返回409。",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "返回data与meta，或明确配置缺项错误"
          },
          "401": {
            "description": "未登录或验证码无效"
          },
          "403": {
            "description": "权限、Origin或CSRF校验失败"
          },
          "409": {
            "description": "幂等或资源状态冲突"
          },
          "422": {
            "description": "参数无效"
          },
          "429": {
            "description": "限流，包含retryAfterSeconds"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "challengeId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "code": {
                    "type": "string",
                    "pattern": "^[0-9]{6}$"
                  },
                  "deviceId": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "platform": {
                    "const": "h5"
                  }
                },
                "required": [
                  "challengeId",
                  "code",
                  "deviceId",
                  "platform"
                ]
              }
            }
          }
        }
      }
    },
