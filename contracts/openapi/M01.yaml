              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/Challenge"
                    },
                    "meta": {
                      "type": "object",
                      "properties": {
                        "requestId": {
                          "type": "string",
                          "format": "uuid"
                        },
                        "serverTime": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "timezone": {
                          "const": "Asia/Shanghai"
                        }
