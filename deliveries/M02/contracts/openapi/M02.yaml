        "parameters": [
          {
            "name": "X-Client-Platform",
            "in": "header",
            "required": true,
            "description": "00 总契约规定的 H5 通用请求头，由 M01 公共入口按统一规则处理。",
            "schema": {
              "type": "string",
              "const": "h5"
            },
            "example": "h5"
          },
          {
            "name": "date",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date"
            },
            "example": "2026-10-20",
            "description": "YYYY-MM-DD，按 Asia/Shanghai 业务日期解释。省略时使用当前上海业务日。"
          },
          {
            "name": "timezone",
            "in": "query",
            "required": false,
            "schema": {
              "const": "Asia/Shanghai"
            },
            "example": "Asia/Shanghai"
          }
        ],
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "summary": "查询今日或指定上海日期的个人看板",
        "description": "date 省略时为当前上海业务日。历史页面使用当前目标；缺目标相关项为 null。同一只读快照读取跨组端口。 未声明的业务 Body/Query 字段返回 422；身份仅取自服务端会话。",
        "x-error-codes": [
          {
            "code": "UNAUTHENTICATED",
            "status": 401,
            "when": "未登录、会话过期或账号不可用。",
            "owner": "M01 身份 / M02 身份检查"
