{
  "openapi": "3.1.0",
  "info": {
    "title": "轻养 M02 健康记录与个人看板",
    "version": "QY-MYSQL-1.0.0",
    "description": "10 个接口；共享身份、幂等、CSRF 与 envelope 由 M01 装配。仅 M02 三张健康表。\n所有业务请求携带 X-Client-Platform: h5；写请求携带 CSRF，POST 使用 UUID v4 幂等键。\n示例全部为文档构造数据，不代表数据库中的用户或记录。示例日期为 2026-10-20，实际调用按服务端上海业务日计算。\n正式 Cookie 名称和 CSRF 获取流程待 M01 统一确认；本地测试会话只用于显式开发配置。"
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "paths": {
